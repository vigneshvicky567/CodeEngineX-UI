services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rce_password}
      POSTGRES_DB: ${POSTGRES_DB:-rce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rce} -d ${POSTGRES_DB:-rce_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rce}:${POSTGRES_PASSWORD:-rce_password}@postgres:5432/${POSTGRES_DB:-rce_db}
      RUNNER: ${RUNNER:-judge0}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0:2358}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_TIMEOUT_S: ${JUDGE0_TIMEOUT_S:-30}
      DEFAULT_TIME_LIMIT_MS: ${DEFAULT_TIME_LIMIT_MS:-1000}
      DEFAULT_MEMORY_LIMIT_KB: ${DEFAULT_MEMORY_LIMIT_KB:-262144}
      OUTPUT_LIMIT_BYTES: ${OUTPUT_LIMIT_BYTES:-10485760}
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rce}:${POSTGRES_PASSWORD:-rce_password}@postgres:5432/${POSTGRES_DB:-rce_db}
      RUNNER: ${RUNNER:-judge0}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0:2358}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_TIMEOUT_S: ${JUDGE0_TIMEOUT_S:-30}
      DEFAULT_TIME_LIMIT_MS: ${DEFAULT_TIME_LIMIT_MS:-1000}
      DEFAULT_MEMORY_LIMIT_KB: ${DEFAULT_MEMORY_LIMIT_KB:-262144}
      OUTPUT_LIMIT_BYTES: ${OUTPUT_LIMIT_BYTES:-10485760}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-2.0}
    depends_on:
      postgres:
        condition: service_healthy

  judge0:
    image: mrkushalsm/judge0:latest
    restart: unless-stopped
    ports:
      - "2358:2358"
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
      RAILS_MAX_THREADS: 4
      RAILS_ENV: production
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_NETWORK: "false"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-worker:
    image: mrkushalsm/judge0:latest
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
      RAILS_MAX_THREADS: 4
      RAILS_ENV: production
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_NETWORK: "false"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 10

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "19006:19006"
      - "19007:19007"
      - "8081:8081"
    environment:
      EXPO_DEBUG: ${EXPO_DEBUG:-false}
    depends_on:
      - api

volumes:
  postgres_data:
  judge0_postgres_data:
  judge0_redis_data:
