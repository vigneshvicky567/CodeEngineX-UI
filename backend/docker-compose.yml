services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rce_password}
      POSTGRES_DB: ${POSTGRES_DB:-rce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rce} -d ${POSTGRES_DB:-rce_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.11-slim
    command: bash -c "apt-get update && apt-get install -y gcc libpq-dev && pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rce}:${POSTGRES_PASSWORD:-rce_password}@postgres:5432/${POSTGRES_DB:-rce_db}
      RUNNER: docker
      PORT: ${PORT:-8000}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
